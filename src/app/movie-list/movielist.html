<h2>Meine Watchlist</h2>

@for (movie of movies; track movie.id) {
  <p>
    Titel: {{ movie.title }} <br>
    Genre: {{ movie.genre }} <br>
    @if (movie.rating) {
        Rating: {{ movie.rating }}
    }
    
  </p>
  <button (click)="deleteMovie(movie.id)">Delete</button>
}

<form>
  <input
    type="text"
    [(ngModel)]="newTitle"
    name="title"
    placeholder="Titel">

  <input
    type="text"
    [(ngModel)]="newGenre"
    name="genre"
    placeholder="Genre">

  <input
    type="number"
    [(ngModel)]="newRating"
    name="rating"
    placeholder="Rating">
</form>
