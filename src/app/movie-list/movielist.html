<h2>Meine Watchlist</h2>

@for (movie of movies; track movie.id) {
  <p>
    Titel: {{ movie.title }} <br>
    Genre: {{ movie.genre }} <br>
    @if (movie.rating) {
        Rating: {{ movie.rating }}
    }
    
  </p>
  <button (click)="deleteMovie(movie.id)">Delete</button>
}

<form (ngSubmit)="createMovie()">
  <input
    type="text"
    [(ngModel)]="newTitle"
    name="title"
    #title="ngModel"
    required
    placeholder="Titel">
  
  @if (title.invalid && title.touched) {
  <span>Titel ist erforderlich.</span>
}

  <input
    type="text"
    [(ngModel)]="newGenre"
    name="genre"
    placeholder="Genre">

  <input
    type="number"
    [(ngModel)]="newRating"
    name="rating"
    placeholder="Rating">

  <button type="submit">Hinzufügen</button>
</form>
